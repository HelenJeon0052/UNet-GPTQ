[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-gptq-data"
version = "0.1.0"
description = "Reconstruction Solution fastMRI brain preprocessing for U-Net diffusion and GPTQ experiments"
readme = 'README.md'
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "numpy>=1.24",
  "torch>=2.1",
]
authors = [
    { name = 'JiinJeon', email = 'jeon.isavelle@gmail.com'},]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ['unet_gptq*']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]